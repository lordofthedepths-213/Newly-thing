<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14181f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Utility Mapper" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Utility Mapper</title>
  </head>
  <body>
    <div id="map" aria-label="Utility map"></div>

    <header class="topbar">
      <h1>Utility Mapper</h1>
      <button id="btn-base" class="pill" type="button">Satellite</button>
      <button id="btn-menu" class="pill" type="button" aria-label="Menu and utility list">☰ List</button>
    </header>

    <nav id="legend" class="legend" aria-label="Utility colour legend"></nav>

    <button id="btn-locate" class="fab fab-locate" type="button" aria-label="Show my location">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
      </svg>
    </button>
    <button id="btn-add" class="fab fab-add" type="button">+ Add utility</button>

    <section id="drawbar" class="drawbar" hidden></section>

    <div id="scrim" class="scrim" hidden></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>

    <div id="toast" class="toast" role="status" hidden></div>
    <input id="file-import" type="file" accept=".geojson,.json,application/geo+json,application/json" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
